name: Run Pytest Tests

on: push

  #pull_request:
    #branches:
     # - main  # Trigger workflow for PRs targeting the main branch

jobs:
  test:
    runs-on: ubuntu-latest   #Git Action runner 

    steps:
      # Checkout the code so the workflow can access it 
      - name: Checkout code
        uses: actions/checkout@v3

      # Cache Python dependencies
      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
         # Cache the pip cache directory
         path: | 
           ~/.cache/pip
         key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
         restore-keys: |
           ${{ runner.os }}-pip-

      # Set up Python version
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  

      # Install dependencies from requirements.txt
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/langchain_bot/requirements.txt 
          pip install pytest pytest-cov pytest-html

     
      # Run pytest on test folder and store logs 
       #- name: Run Pytest
        #run: |
           #python -m pytest test/    
        #env: # Or as an environment variable
            #HF_TOKEN: ${{ secrets.HF_TOKEN }}
    
      # Run Pytest and generate  reports
      - name: Run Pytest and Generate Reports
        run: |
          pytest --cov=apps/langchain_bot --cov-report=xml --cov-report=html --junitxml=report.xml --html=report.html
        env: 
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      # Upload test reports (HTML and XML) as artifacts
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            report.html
            report.xml
            htmlcov/

       